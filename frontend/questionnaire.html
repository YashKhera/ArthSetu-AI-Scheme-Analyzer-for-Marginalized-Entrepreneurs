<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Questionnaire - ArthSetu</title>

  <!-- CSS -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/navigation.css">
  <link rel="stylesheet" href="css/responsive.css">

  <style>
    .questionnaire-container {
      min-height: 100vh;
      padding: var(--spacing-xl) 0;
    }

    .question-card {
      max-width: 700px;
      margin: 0 auto;
      background: var(--color-warm-white);
      padding: var(--spacing-xl);
      border-radius: var(--radius-md);
      border: 1px solid var(--color-border);
    }

    .progress-container {
      margin-bottom: var(--spacing-xl);
    }

    .progress-text {
      text-align: center;
      margin-bottom: var(--spacing-sm);
      color: var(--color-text-muted);
      font-size: var(--font-size-sm);
    }

    .question-title {
      font-size: var(--font-size-xl);
      margin-bottom: var(--spacing-md);
      color: var(--color-navy);
    }

    .question-description {
      color: var(--color-text-muted);
      margin-bottom: var(--spacing-lg);
    }

    .options-container {
      margin-bottom: var(--spacing-xl);
    }

    .option-button {
      width: 100%;
      padding: var(--spacing-md);
      margin-bottom: var(--spacing-sm);
      border: 2px solid var(--color-border);
      border-radius: var(--radius-md);
      background: white;
      cursor: pointer;
      text-align: left;
      transition: all var(--transition-fast);
      font-size: var(--font-size-base);
    }

    .option-button:hover {
      border-color: var(--color-terracotta);
      background: var(--color-cream);
    }

    .option-button.selected {
      border-color: var(--color-terracotta);
      background: var(--color-terracotta);
      color: white;
    }

    .navigation-buttons {
      display: flex;
      gap: var(--spacing-md);
      justify-content: space-between;
    }

    .analyzing {
      text-align: center;
      padding: var(--spacing-2xl);
    }

    .analyzing-title {
      font-size: var(--font-size-2xl);
      margin-bottom: var(--spacing-lg);
    }

    .analyzing-steps {
      max-width: 500px;
      margin: 0 auto;
      text-align: left;
    }

    .analyzing-step {
      padding: var(--spacing-md);
      margin-bottom: var(--spacing-sm);
      border-left: 4px solid var(--color-border);
      transition: all var(--transition-base);
    }

    .analyzing-step.active {
      border-color: var(--color-terracotta);
      background: var(--color-cream);
    }

    .analyzing-step.complete {
      border-color: var(--color-success);
    }
  </style>
<script src="js/theme.js"></script>
  <script src="js/i18n.js"></script>
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="container">
      <nav class="navbar">
        <a href="index.html" class="logo">ArthSetu</a>
        <div class="nav-links">
          <a href="index.html" class="btn btn-link" data-i18n="nav.home">Home</a>
          <a href="questionnaire.html" class="btn btn-link" data-i18n="nav.find">Find Schemes</a>
          <a href="saved-schemes.html" class="btn btn-link" data-i18n="nav.saved">Saved Schemes</a>
          <a href="profile-view.html" class="btn btn-link" data-i18n="nav.profile">My Profile</a>
          <button onclick="Storage.logout()" class="btn btn-link" data-i18n="nav.logout">Logout</button>
        </div>
      </nav>
    </div>
  </header>

  <div class="questionnaire-container">
    <div class="container">
      <!-- Progress Bar -->
      <div class="progress-container" id="questionProgress"></div>

      <!-- Question Card -->
      <div class="question-card" id="questionCard">
        <h2 class="question-title" id="questionTitle">Loading...</h2>
        <p class="question-description" id="questionDescription"></p>

        <div id="questionContent"></div>

        <div class="navigation-buttons">
          <button class="btn btn-secondary" id="backBtn" style="display: none;">
            ← <span data-i18n="q.back">Back</span>
          </button>
          <button class="btn btn-primary" id="nextBtn" disabled>
            <span data-i18n="q.next">Next →</span>
          </button>
        </div>
      </div>

      <!-- Analyzing Screen (hidden initially) -->
      <div class="analyzing hidden" id="analyzingScreen">
        <div class="analyzing-title">🔍 <span data-i18n="q.analyzing">Analyzing Your Responses</span></div>
        <div class="analyzing-steps">
          <div class="analyzing-step" id="step1">
            <strong data-i18n="q.step1">Step 1: Processing your profile</strong>
          </div>
          <div class="analyzing-step" id="step2">
            <strong data-i18n="q.step2">Step 2: Matching with government schemes</strong>
          </div>
          <div class="analyzing-step" id="step3">
            <strong data-i18n="q.step3">Step 3: Calculating compatibility scores</strong>
          </div>
          <div class="analyzing-step" id="step4">
            <strong data-i18n="q.step4">Step 4: Preparing your personalized recommendations</strong>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/storage.js"></script>
  <script src="js/api.js"></script>
  <script src="js/matching.js"></script>
  <script src="js/components/progress-bar.js"></script>
  <script src="js/data/questions.js"></script>
  <script src="js/data/schemes.js"></script>
  <script src="js/pages/questionnaire.js"></script>
</body>
</html>
