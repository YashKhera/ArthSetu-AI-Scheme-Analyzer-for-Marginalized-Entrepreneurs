<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - ArthSetu</title>

  <!-- CSS -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/navigation.css">
  <link rel="stylesheet" href="css/responsive.css">

  <style>
    .auth-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--spacing-lg);
    }

    .auth-card {
      width: 100%;
      max-width: 450px;
    }

    .auth-header {
      text-align: center;
      margin-bottom: var(--spacing-xl);
    }

    .auth-logo {
      font-size: var(--font-size-2xl);
      font-weight: 700;
      color: var(--color-terracotta);
      text-decoration: none;
      display: inline-block;
      margin-bottom: var(--spacing-md);
    }

    .auth-footer {
      text-align: center;
      margin-top: var(--spacing-lg);
      color: var(--color-text-muted);
    }
  </style>
<script src="js/theme.js"></script>
  <script src="js/i18n.js"></script>
</head>
<body>
  <div class="auth-container">
    <div class="auth-card card">
      <div class="auth-header">
        <a href="index.html" class="auth-logo">ArthSetu</a>
        <h1 data-i18n="auth.register.title">Create Your Account</h1>
        <p class="text-muted" data-i18n="auth.register.subtitle">Start discovering schemes for your business</p>
      </div>

      <!-- Alert for messages -->
      <div id="alert" class="hidden"></div>

      <!-- Registration Form -->
      <form id="registerForm">
        <div class="form-group">
          <label for="fullName" class="form-label form-label-required">Full Name</label>
          <input
            type="text"
            id="fullName"
            name="fullName"
            class="form-input"
            required
            placeholder="Enter your full name"
          >
        </div>

        <div class="form-group">
          <label for="email" class="form-label form-label-required">Email Address</label>
          <input
            type="email"
            id="email"
            name="email"
            class="form-input"
            required
            placeholder="you@example.com"
          >
        </div>

        <div class="form-group">
          <label for="phone" class="form-label form-label-required">Phone Number</label>
          <input
            type="tel"
            id="phone"
            name="phone"
            class="form-input"
            required
            placeholder="10-digit mobile number"
          >
        </div>

        <div class="form-group">
          <label for="password" class="form-label form-label-required">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            class="form-input"
            required
            placeholder="At least 6 characters"
          >
        </div>

        <div class="form-group">
          <label for="confirmPassword" class="form-label form-label-required">Confirm Password</label>
          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            class="form-input"
            required
            placeholder="Re-enter your password"
          >
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="submitBtn">
          Create Account
        </button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="login.html">Login</a>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/storage.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/api.js"></script>
  <script src="js/pages/auth.js"></script>
</body>
</html>
