<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile - ArthSetu</title>

  <!-- CSS -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/navigation.css">
  <link rel="stylesheet" href="css/responsive.css">

  <style>
    .profile-view-container {
      min-height: 100vh;
      padding: var(--spacing-xl) 0;
    }

    .profile-view-header {
      text-align: center;
      margin-bottom: var(--spacing-xl);
    }

    .completeness-wrap {
      max-width: 560px;
      margin: var(--spacing-lg) auto;
      text-align: center;
    }

    .completeness-bar {
      height: 12px;
      background: var(--color-cream);
      border-radius: 999px;
      overflow: hidden;
      margin-top: var(--spacing-xs);
    }

    .completeness-fill {
      height: 100%;
      background: var(--color-sage);
      border-radius: 999px;
      transition: width 0.5s ease;
    }

    #completenessPct {
      font-weight: 700;
      color: var(--color-terracotta);
    }

    .profile-actions {
      display: flex;
      justify-content: center;
      gap: var(--spacing-md);
      flex-wrap: wrap;
      margin-bottom: var(--spacing-xl);
    }

    .detail-card {
      background: var(--color-warm-white);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: var(--spacing-lg);
      margin-bottom: var(--spacing-lg);
    }

    .detail-card h2 {
      font-size: var(--font-size-md);
      font-weight: 700;
      color: var(--color-navy);
      padding-bottom: var(--spacing-sm);
      border-bottom: 2px solid var(--color-border);
      margin-bottom: var(--spacing-md);
    }

    .detail-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: var(--spacing-md);
    }

    .detail-item .detail-label {
      font-size: var(--font-size-xs);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--color-text-muted);
    }

    .detail-item .detail-value {
      font-size: var(--font-size-sm);
      font-weight: 600;
      color: var(--color-navy);
      margin-top: 2px;
    }

    .detail-tags {
      display: flex;
      gap: var(--spacing-xs);
      flex-wrap: wrap;
    }

    .detail-tag {
      background: var(--color-cream);
      color: var(--color-navy);
      padding: 2px 10px;
      border-radius: 999px;
      font-size: var(--font-size-xs);
      font-weight: 600;
    }

    .empty-value {
      color: var(--color-text-muted);
      font-weight: 400;
      font-style: italic;
    }
  </style>
<script src="js/theme.js"></script>
  <script src="js/i18n.js"></script>
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="container">
      <nav class="navbar">
        <a href="index.html" class="logo">ArthSetu</a>
        <div class="nav-links">
          <a href="index.html" class="btn btn-link" data-i18n="nav.home">Home</a>
          <a href="questionnaire.html" class="btn btn-link" data-i18n="nav.find">Find Schemes</a>
          <a href="saved-schemes.html" class="btn btn-link" data-i18n="nav.saved">Saved Schemes</a>
          <a href="profile-view.html" class="btn btn-link" data-i18n="nav.profile">My Profile</a>
          <button onclick="Storage.logout()" class="btn btn-link" data-i18n="nav.logout">Logout</button>
        </div>
      </nav>
    </div>
  </header>

  <div class="profile-view-container">
    <div class="container">
      <div class="profile-view-header">
        <h1 data-i18n="view.title">My Profile</h1>
        <p class="text-muted" data-i18n="view.subtitle">Review and manage your entrepreneur profile</p>
      </div>

      <!-- Actions -->
      <div class="profile-actions">
        <a href="profile.html" class="btn btn-primary" data-i18n="view.edit">Edit Profile</a>
        <a href="questionnaire.html" class="btn btn-secondary" data-i18n="view.find">Find Schemes</a>
        <a href="saved-schemes.html" class="btn btn-secondary" data-i18n="view.saved">Saved Schemes</a>
      </div>

      <!-- Completeness -->
      <div class="completeness-wrap">
        <div class="text-muted"><span data-i18n="view.completeness">Profile completeness:</span> <span id="completenessPct">0%</span></div>
        <div class="completeness-bar"><div class="completeness-fill" id="completenessFill" style="width:0%"></div></div>
      </div>

      <!-- Content -->
      <div id="profileContent">
        <div class="text-center text-muted" data-i18n="view.loading">Loading profile...</div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/storage.js"></script>
  <script src="js/api.js"></script>
  <script src="js/pages/profile-view.js"></script>
</body>
</html>
