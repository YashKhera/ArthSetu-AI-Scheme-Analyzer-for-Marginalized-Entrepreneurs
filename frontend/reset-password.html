<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - ArthSetu</title>

  <!-- CSS -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/navigation.css">
  <link rel="stylesheet" href="css/responsive.css">

  <style>
    .auth-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--spacing-lg);
    }

    .auth-card {
      width: 100%;
      max-width: 24rem; /* shadcn max-w-sm */
    }

    .shadcn-header {
      margin-bottom: var(--spacing-lg);
    }

    .shadcn-title {
      font-size: var(--font-size-xl);
      font-weight: 700;
      color: var(--color-navy);
      margin-bottom: var(--spacing-xs);
    }

    .shadcn-desc {
      color: var(--color-text-muted);
      font-size: var(--font-size-sm);
    }

    .shadcn-content {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .shadcn-field {
      display: grid;
      gap: 0.5rem;
    }

    .shadcn-footer {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-top: var(--spacing-sm);
    }
  </style>
<script src="js/theme.js"></script>
  <script src="js/i18n.js"></script>
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <!-- Alert for messages -->
      <div id="alert" class="hidden"></div>

      <!-- shadcn Card: Reset Password -->
      <div class="card">
        <div class="shadcn-header">
          <h2 class="shadcn-title" data-i18n="auth.reset.title">Set a new password</h2>
          <p class="shadcn-desc" data-i18n="auth.reset.desc">Choose a new password for your account</p>
        </div>

        <form id="resetPasswordForm" class="shadcn-content">
          <input type="hidden" id="resetToken" name="resetToken">

          <div class="shadcn-field">
            <label for="newPassword" class="form-label">New Password</label>
            <input
              type="password"
              id="newPassword"
              name="newPassword"
              class="form-input"
              placeholder="At least 6 characters"
              required
            >
          </div>

          <div class="shadcn-field">
            <label for="confirmNewPassword" class="form-label">Confirm New Password</label>
            <input
              type="password"
              id="confirmNewPassword"
              name="confirmNewPassword"
              class="form-input"
              placeholder="Re-enter your new password"
              required
            >
          </div>

          <div class="shadcn-footer">
            <button type="submit" class="btn btn-primary btn-block">
              Reset Password
            </button>
            <a href="login.html" class="btn btn-ghost btn-block shadcn-link text-center">Back to Login</a>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/storage.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/api.js"></script>
  <script src="js/pages/auth.js"></script>
</body>
</html>
